<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函数参数的使用</title>
<script type="text/javascript">
function show(bookname,author){
    alert("图书名称："+bookname+"\n图书作者："+author);
}
</script>
</head>
<body>
<script type="text/javascript">
    show("零基础学javaScript","明日科技");
</script>
    
</body>
</html>
