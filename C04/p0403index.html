<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script type="text/javascript">
function createTable(row,col,width,height,bdcolor){
    var tableStr="";
    tableStr+=("<table style='width:"+width+"px;height:"+height+"px;border-collapse:collapse'>");
    for(var i=0;i<row;i++){
        tableStr+=("<tr>");
            for(var j=0;j<col;j++);
            tableStr+=("<td style='border:1px solid"+bdcolor+"'></td>");
    }
    tableStr+=("</table>");
    return tableStr;
}
document.write(createTable(4,6,500,"green"));
</script>
    
</body>
</html>
