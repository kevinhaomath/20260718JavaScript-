<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>获取选手的平均分</title>
    <script type="text/javascript">
        function getAvarage(score1,score2,score3){
            var average=(score1+score2+score3)/3;
            return average;
        }
        function getResult(score1,score2,score3){
            document.write("3个评委给出的分数分别为："+score1+"分、"+score2+"分、"+score3+"分<br>");
            var result = getAvarage(score1,score2,score3);
            document.write("周星星的最后得分是："+result+"分");
        }
    </script>
</head>
<body>
<script type="text/javascript">
    getResult(90,80,70);
</script>
</body>
</html>
