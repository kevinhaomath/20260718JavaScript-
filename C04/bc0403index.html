<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script type="text/javascript">
    function compare(n1,n2){
        var result="";
        if(n1>n2){
            result=n1+"大于"+n2;
        }else if(n1<n2){
            result=n1+"小于"+n2;
        }else{
            result=n1+"等于"+n2;
        }
        return result;
    }
    alert(compare(12,15));
</script>
</body>
</html>
