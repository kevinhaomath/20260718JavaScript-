<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script type="text/javascript">
var month =2;
switch(month){
    case 1:
    case 2:
    case 3:
        season="春季";
    case 4: 
    case 5: 
    case 6: 
        season="夏季";
    case 7: 
    case 8: 
    case 9: 
        season="秋季";
        break;
    default: 
        season="冬季";
        break;
}
document.write("现在是"+month+"月");
document.write("<br>当前月份属于"+season);
</script>
    
</body>
</html>
