<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>输出考试成绩对应的等级</title>
</head>
<body>
<script type="text/javascript">
    var grade = "";
    var score = 85;// if else 语句实例
    if(score>=90){
        grade = "优秀";
    }else if(score>=75){
        grade='良好';
    }else if(score>=60){
        grade='及格';
    }else{
        grade='不及格';
    }
alert("周星星的考试成绩"+grade); //跳出文本框，弹出来
</script>
    
</body>
</html>
