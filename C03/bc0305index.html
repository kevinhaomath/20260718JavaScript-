<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script type="text/javascript">
var chicken =0;
var rabbit=0;
for(var i=1; i<=34; i++){
    chicken=i;
    rabbit=35-i;
    if(chicken*2+rabbit*4==94){
        document.write("鸡有"+chicken+"只，兔有"+rabbit+"只");
    }
}
</script>
</body>
</html>
