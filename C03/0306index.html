<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>输出5000米比赛需要跑完整的圈数</title>
</head>
<body>
<script type="text/javascript"> //whil 语句
    var distance=400;
    var count=0;
    while(distance<=50000){
        count++;
        distance=(count+1)*400;
    }
    document.write("5000米比赛需要跑完"+count+"圈");
</script>
    
</body>
</html>
