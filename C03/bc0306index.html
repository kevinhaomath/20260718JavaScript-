<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script type="text/javascript">
    var i,sum;
    sum = 0;
    for(i=1;i<=1000;i++){
        if(i%26!=0){
            continue;
        }
        sum+=i;
    }
    alert("1~1000以内的所有26的倍数和是："+sum);
    document.write("1~1000以内的所有26的倍数和是："+sum);
</script>
</body>
</html>
