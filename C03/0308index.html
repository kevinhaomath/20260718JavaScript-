<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算100以内奇数的和</title>
</head>
<body>
<script type="text/javascript">
    var i,sum;
    sum =0;
    for(i=1;i<100;i+=2){
        sum=sum+i;
    }
alert("100以内的所有奇数和："+sum);
</script>
    
</body>
</html>
