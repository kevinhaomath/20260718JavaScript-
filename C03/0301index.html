<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>获取三个数的最大值</title>
<script type="text/javascript">

var a,b,c,maxValue;
a = 10;
b = 20;
c = 30;
maxValue=a;
if(maxValue<b){
    maxValue=b;
}
if(maxValue<c){
    maxValue=c;
}
alert(a+"、"+b+"、"+c+"三个数的最大值为"+maxValue);// 输出结果
    
</script>
</head>
<body>
</body>
</html>
