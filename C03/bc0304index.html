<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script type="text/javascript">
var base_wages=3000;
var year=0;
var age_wages=0;
do{
    year++;
    age_wages=50*year;
    document.write("员工工作"+year+"年后的工资为<b>"+(base_wages+age_wages)+"</b>元<br>");
} while(year<5);
</script>
</body>
</html>
