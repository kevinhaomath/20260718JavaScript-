<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算1+2+…+100的和</title>
</head>
<body>
<script type="text/javascript">
    var i = 1;
    var sum = 0;
    do{
        sum+=i;
        i++;
    }while(i<=100);
    document.write("1+2+3+...+100的和为："+sum);
</script>
    
</body>
</html>
