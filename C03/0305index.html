<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>输出奖项级别和获得的奖品</title>
</head>
<body>
<script type="text/javascript">
    var grade ="";
    var prize="";
    var code=1; //学习switch函数的写法
    switch(code){
        case 1:
            grade="一等奖";
            prize="华为手机";
            break
        case 2: 
            grade="二等奖";
            prize="光波炉";
            break
        case 3:
            grade="三等奖";
            prize="电饭煲";
            break 
        default:
            grade="安慰奖";
            prize="U盘";
            break
    }
document.write("该员工获得了"+grade+"<br>奖品是"+prize);
</script>
</body>
</html>
