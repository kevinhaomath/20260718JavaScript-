<!DOCTYPE html>                                                      <!-- 声明文档类型为HTML5 -->
<html lang="en">                                                     <!-- 声明页面语言为英语 -->
<head>                                                               <!-- 头部区域开始 -->
    <meta charset="UTF-8">                                           <!-- 设置字符编码为UTF-8，支持中文 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 设置视口，使页面在移动设备上自适应 -->
    <title>在页面的指定位置显示当前日期</title>                       <!-- 设置页面标题，显示在浏览器标签页上 -->
    <style type="text/css">                                          /* 内部CSS样式定义开始 */
        #clock {                                                     /* 定义 ID 为 clock 的样式（日期容器） */
            font-size: 24px;                                         /* 设置字体大小为24像素 */
            color: #FF6600;                                          /* 设置文字颜色为橙色 */
            font-weight: bold;                                       /* 设置字体加粗 */
            padding: 10px;                                           /* 设置内边距为10像素 */
            background-color: #F0F0F0;                               /* 设置背景色为浅灰色 */
            border-radius: 8px;                                      /* 设置圆角为8像素 */
            display: inline-block;                                   /* 设置为行内块级元素，宽度自适应 */
        }                                                            /* clock 样式定义结束 */
        #clock2 {                                                    /* 定义 ID 为 clock2 的样式（时钟容器） */
            font-size: 36px;                                         /* 设置字体大小为36像素 */
            color: #FF0000;                                          /* 设置文字颜色为红色 */
            font-weight: bold;                                       /* 设置字体加粗 */
            padding: 10px 20px;                                      /* 设置上下内边距10像素，左右内边距20像素 */
            background-color: #222;                                  /* 设置背景色为深灰 */
            color: #00FF00;                                          /* 设置文字颜色为亮绿色（类似数码管效果） */
            border-radius: 8px;                                      /* 设置圆角为8像素 */
            display: inline-block;                                   /* 设置为行内块级元素，宽度自适应 */
            font-family: 'Courier New', monospace;                   /* 设置等宽字体，使数字对齐整齐 */
            letter-spacing: 4px;                                     /* 设置字符间距为4像素，增强数码管效果 */
            margin-top: 20px;                                        /* 设置上边距为20像素 */
        }                                                            /* clock2 样式定义结束 */
        .container {                                                 /* 定义容器样式，用于居中排列 */
            text-align: center;                                      /* 设置文本居中 */
            margin-top: 50px;                                        /* 设置上边距为50像素 */
        }                                                            /* container 样式定义结束 */
    </style>                                                        
    <script type="text/javascript">
        // ==================== 日期显示函数 ====================
        function clockon(){                                          // 定义 clockon 函数，用于获取当前日期并显示在页面中
            var now = new Date();                                    // 创建 Date 对象，获取当前日期和时间
            var year = now.getFullYear();                            // 获取当前年份（四位数，如 2026）
            var month = now.getMonth();                              // 获取当前月份（0-11，0 表示一月）
            var date = now.getDate();                                // 获取当前日期（1-31）
            var day = now.getDay();                                  // 获取当前星期几（0-6，0 表示星期日）
            var week;                                                // 声明变量 week，用于存储中文星期名称
            month = month + 1;                                       // 月份加 1，转换为实际月份（1-12）
            var arr_week = new Array("星期日","星期一","星期二","星期三","星期四","星期五","星期六"); // 创建星期数组，索引 0-6 对应星期日到星期六
            week = arr_week[day];                                    // 根据 day 值从数组中获取对应的中文星期名称
            time = year + "年" + month + "月" + date + "日" + week;   // 拼接日期字符串
            var textTime = document.createTextNode(time);            // 根据日期字符串创建文本节点
            document.getElementById("clock").appendChild(textTime);  // 通过 ID "clock" 获取容器，将文本节点添加为子节点
        }                                                            // clockon 函数定义结束

        // ==================== 时钟显示函数 ====================
        function clockRun(){                                         // 定义 clockRun 函数，用于实时更新时间
            var now = new Date();                                    // 创建 Date 对象，获取当前日期和时间
            var hours = now.getHours();                              // 获取当前小时（0-23）
            var minutes = now.getMinutes();                          // 获取当前分钟（0-59）
            var seconds = now.getSeconds();                          // 获取当前秒数（0-59）
            // 补零操作：如果小于 10，在前面加 "0"，保持两位数显示
            hours = hours < 10 ? "0" + hours : hours;                // 小时补零
            minutes = minutes < 10 ? "0" + minutes : minutes;        // 分钟补零
            seconds = seconds < 10 ? "0" + seconds : seconds;        // 秒数补零
            var timeStr = hours + ":" + minutes + ":" + seconds;     // 拼接时间字符串
            var clockElement = document.getElementById("clock2");    // 通过 ID "clock2" 获取时钟容器
            clockElement.innerHTML = "🕐 " + timeStr;                // 更新时钟容器的内容，显示时间
        }                                                            // clockRun 函数定义结束

        // ==================== 启动函数 ====================
        function init(){                                             // 定义 init 函数，用于初始化页面
            clockon();                                               // 调用 clockon 函数显示日期
            clockRun();                                              // 调用 clockRun 函数显示时间
            setInterval(clockRun, 1000);                             // 每隔 1000 毫秒（1秒）执行一次 clockRun 函数，实现动态更新
        }                                                            // init 函数定义结束

        window.onload = init;                                        // 页面加载完成后自动执行 init 函数
    </script>
</head>                                                              <!-- 头部区域结束 -->
<body>                                                               <!-- 页面主体区域开始 -->
    <div class="container">                                          <!-- 容器，用于居中排列 -->
        <div id="clock"> 当前日期：</div>                             <!-- 日期容器，ID 为 clock -->
        <br>                                                         <!-- 换行 -->
        <div id="clock2"> 🕐 00:00:00</div>                          <!-- 时钟容器，ID 为 clock2，初始显示占位 -->
    </div>                                                           <!-- 容器结束 -->
</body>                                                              <!-- 页面主体区域结束 -->
</html>                                                              <!-- 整个HTML文档结束 -->
