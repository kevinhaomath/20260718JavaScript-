<!DOCTYPE html>                                                      <!-- 声明文档类型为HTML5 -->
<html lang="en">                                                     <!-- 声明页面语言为英语 -->
<head>                                                               <!-- 头部区域开始 -->
    <meta charset="UTF-8">                                           <!-- 设置字符编码为UTF-8，支持中文 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 设置视口，使页面在移动设备上自适应 -->
    <title>插入节点</title>                                           <!-- 设置页面标题，显示在浏览器标签页上 -->
    <script type="text/javascript">
        function crNode(str){                                         // 定义 crNode 函数，用于创建包含指定文本的 p 元素
            var newP = document.createElement("p");                  // 创建一个新的 <p> 段落元素
            var newTxt = document.createTextNode(str);               // 根据传入的字符串创建文本节点
            newP.appendChild(newTxt);                                // 将文本节点添加到 <p> 元素中
            return newP;                                             // 返回创建好的 <p> 元素
        }                                                            // crNode 函数定义结束

        function insetNode(nodeId, str){                             // 定义 insetNode 函数，用于在指定节点前插入新节点
            var node = document.getElementById(nodeId);              // 通过 ID 获取目标节点
            var newNode = crNode(str);                               // 调用 crNode 函数创建新的 <p> 元素
            if(node.parentNode)                                      // 判断目标节点是否存在父节点
                node.parentNode.insertBefore(newNode, node);         // 将新节点插入到目标节点之前（父节点.insertBefore(新节点, 目标节点)）
        }                                                            // insetNode 函数定义结束
    </script>
</head>                                                              <!-- 头部区域结束 -->
<body>                                                               <!-- 页面主体区域开始 -->
    <h2 id="h">在上面插入节点</h2>                                    <!-- 二级标题，ID为 h，作为插入新节点的参照目标 -->
    <form id="frm" name="frm">                                       <!-- 创建表单，ID和名称均为 frm -->
        输入文本：<input type="text" name="txt">                       <!-- 文本输入框，名称为 txt，用于输入要插入的文字内容 -->
        <input type="button" value="前插入" onclick="insetNode('h', document.frm.txt.value);"> <!-- 按钮，点击时将文本框内容插入到 h2 标题之前 -->
    </form>                                                          <!-- 表单结束 -->
</body>                                                              <!-- 页面主体区域结束 -->
</html>                                                              <!-- 整个HTML文档结束 -->
