<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>测试</title>
</head>
<body>
<button onclick="test()">打开新窗口</button>

<script>
function test() {
    var w = window.open('', '_blank');
    w.document.write('<h1>成功！</h1>');
    w.document.write('<p>图片测试：</p>');
    w.document.write('<img src="https://picsum.photos/300/200">');
    w.document.close();
}
</script>
</body>
</html>
