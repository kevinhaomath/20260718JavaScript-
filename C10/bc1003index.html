<!DOCTYPE html>                                                                     <!-- 声明文档类型和语言为英语 -->
<html lang="en">                                                                    <!-- 声明页面语言为英语 -->
<head>                                                                              <!-- 头部区域，包含元数据和脚本 -->
    <meta charset="UTF-8">                                                          <!-- 设置字符编码为UTF-8，支持中文 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">          <!-- 设置视口，使页面在移动设备上自适应 -->
    <title>Document</title>                                                         <!-- 页面标题，显示在浏览器标签页上 -->
    <script type="text/javascript">                                                 // JavaScript脚本开始
        var str = "javascript从入门到精通";                                          // 定义一个字符串变量，存储要显示的文本内容
        var i = 0;                                                                  // 定义一个计数器变量，用于追踪当前要显示字符的索引位置，初始为0
        function addWorld(){                                                        // 定义一个名为 addWorld 的函数，当按钮被点击时执行
            var txt = document.createElement("span");                               // 创建一个新的 <span> HTML元素，用于容纳单个字符
            txt.style.color = "#FF0000";                                            // 设置该 <span> 元素的文本颜色为红色 (#FF0000)
            txt.innerHTML = str.charAt(i);                                          // 使用 charAt 方法从字符串中获取索引 i 对应的字符，并设置为 <span> 的HTML内容
            document.getElementById("show").appendChild(txt);                       // 通过ID "show" 找到 <p> 元素，并将新创建的 <span> 添加为其子节点，从而在页面上显示该字符
            i++;                                                                    // 计数器 i 自增1，以便下一次点击时显示下一个字符
        }                                                                           // addWorld 函数定义结束
    </script>                                                        
</head>                                                                             <!-- 头部结束 -->
<body>                                                                              <!-- 页面主体开始 -->
    <form name="form1">                                                             <!-- 创建一个表单，名称为 form1，用于包含按钮等交互元素 -->
        <input type="button" name="btn1" value="添加文字" onclick="addWorld()">     <!-- 创建一个按钮，类型为button，名称为 btn1，显示文字为"添加文字"，点击时触发 addWorld 函数 -->
    </form>                                                                         <!-- 表单结束 -->
    <p id="show"></p>                                                               <!-- 创建一个段落 <p> 元素，ID为 "show"，用于作为容器，显示每次添加的字符，初始为空 -->
</body>                                                                             <!-- 主体结束 -->
</html>                                                                             <!-- 整个HTML文档结束 -->
