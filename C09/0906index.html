<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>限制文本框的输入</title>
<style>
    body{
        font-size: 12px;
    }
</style>
<meta http-equiv="Content-Type" content="text/html;charset=gb2312">
</head>
<body>
<table width="650" height="34" border="0" align="center" cellpadding="0" cellspacing="0" background="/C09/top_03.jpg" bgcolor="#B3CAEE">
<tr class="font_white">
    <td height="22" align="center"><span class="style">======&nbsp;用户注册信息&nbsp;======</span></td>
</tr>
</table>
<table width="650" height="205" border="0" align="center" cellpadding="-2" cellspacing="-2" class="tableBorder">
<tr valign="top">
    <td height="171" colspan="3"><table width="100%" height="129" border="0" cellpadding="-2" cellspacing="-2">
        <tr>
        <td valig="top">
            <table width="100%" height="265" border="0" cellpadding="-2" cellspacing="-2" class="tableBorder_Top">
              <tr>
                <td height="5"></td>
              </tr>
              <tr>
                <td width="195" height="263" valign="top"><table width="100%" border="0" cellspacing="-2" cellpadding="-2">
                    <tr>
                        <td width="55%" height="82" align="center" class="word_grey">&nbsp;<img src="/C09/reg.gif" width="84" height="54"></td>
                        <td width="45%" align="left" class="word_grey"><b>注册帮助</b></td>
                    </tr>
                    <tr>
                        <td height="112" colspan="2" valign="top" class="word_grey"><ul>
                            <li>用户名：为用户登录留言簿通行证，可使用英文字母、数字和下划线</li>
                            <li>真实姓名：请输入真是的姓名，只能是英文或汉字</li>
                            <li>年龄：用户的真是年龄，只可输入数字</li>
                            <li>Email：请填写有效的Email地址，以便与您联系</li>
                        </ul>
                        </td>
                    </tr>
                    <tr align="center">
                        <td colspan="2" valign="middle" class="word_grey"></td>
                    </tr>
                </table></td>
                <td width="19" background="/C09/line.gif"></td>
                <td width="436" valign="top"><br><br>
                    <table width="90%" border="0" align="center" cellpadding="-2" cellspacing="-2">
                        <tr>
                            <td>
                                <form name="form1">
                                    <table width="100%" border="0" cellspacing="-2" cellpadding="-2">
                                        <tr>
                                            <td width="18%" height="30" align="center">用户名：</td>
                                            <td width="82%"><input name="UserName" type="text" id="UserName4" maxlength="20" placeholder="请输入用户名">*</td>
                                        </tr>
                                        <tr>
                                            <td height="28" align="center">真实姓名：</td>
                                            <td height="28"><input name="TrueName" type="text" id="TrueName4" maxlength="10" onkeydown="Clavier(1)" placeholder="请输入身份证上姓名">*</td>
                                        </tr>
                                        <tr>
                                           <td height="28" align="center">年龄：</td>
                                           <td><input name="Age" type="text" id="Age" onkeydown="Clavier(0)" placeholder="请输入数字">*</td> 
                                        </tr>
                                        <tr>
                                            <td height="28" align="center">证件号码：</td>
                                            <td class="word_grey"><input name="pcard" type="text" id="pcard" onkeydown="Clavier(0)" placeholder="证件号码"></td>
                                        </tr>
                                        <tr>
                                            <td height="28" align="center">联系电话：</td>
                                            <td><input type="text" name="tel" id="Tel"></td>
                                        </tr>
                                        <tr>
                                            <td height="28" align="center" style="padding-left: 10px;">Email：</td>
                                            <td class="word_grey"><input name="Email" type="text" id="PWD224" placeholder="请输入有效的邮箱地址"></td>
                                        </tr>
                                        <tr>
                                            <td height="28" align="center">个人主页：</td>
                                            <td class="word_grey"><input type="text" name="homepage" id="homepage" size="35"></td>
                                        </tr>
                                          <td height="34">&nbsp;</td>
                                          <td class="word_grey"><input type="button" name="Button" class="btn_grey" value="确定保存">
                                            <input type="reset" name="Submit2" class="btn_grey" value="重新填写"></td>
                                        </tr>
                                    </table>
                                </form>
                            </td>
                        </tr>

                    </table></td></tr>
                    <tr>
                        <td height="5"></td>
                    </tr>
            </table></td>
            </tr>
    </table></td>
</tr>
</table>
<script type="text/javascript">
var T=true;
function Clavier(n){
    var k=event.keyCode;
    if(n==1){
        if (k>=65 && k<=90)
        T=true;
        else
        T=false;
    }else if(n==0){
        if((k>=48 && k<=57)||(k>=96 && k<=105)){
            T=true;
        }else
            T=false;
    }
    if((k==37)||(k==39)||(k==8)||(k==46))
        T=true;
    if(T==false)
        event.preventDefault();
}

</script>
</body>
</html>
