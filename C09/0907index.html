<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页加载时缩小图片</title>
</head>
<body onload="reduce()">
<img src="/C09/image1.jpg" id="img1" onmouseout="reduce()" onmouseover="blowup()">
<script type="text/javascript">
    var h=0;
    var w=0;
function reduce(){
    h=img1.height;
    w=img1.width;
    img1.height=h-100;
    img1.width=w-100;
}
function blowup(){
    img1.height=h;
    img1.width=w;
}
</script>

    
</body>
</html>
