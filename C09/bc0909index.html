<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .droptarget{
        width: 100px;
        height: 35px;
        margin: 15px;
        padding: 10px;
        border: 1px solid #aaaaaa;
    }
</style>
</head>
<body>
<p draggable="true" id="dragtarget">拖动到矩形中</p>
<div class="droptarget" ondragover="dragover(event)" ondrop="drop(event)"></div>
<script type="text/javascript">
    var pic = document.getElementById("dragtarget");
    function dragover(e){
        e.preventDefault();
    }
    function drop(e){
        e.preventDefault();
        e.target.appendChild(pic);
    }
</script>
</body>
</html>
