<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
<title></title>
<link href="/C09/style08.css" type="text/css" rel="stylesheet">
</head>
<body>
<div class="mr-cont">
   	<div id="left">
   		<img src="/C09/face.png" id="pic">
   	</div>
  	<div id="right" ondragover="DragObject(event)" ondragleave="DragObject(event)" ondrop="DragObject(event)"></div>
</div>
<script type="text/javascript">
	function DragObject(Devent){
		switch(Devent.type) {
			case "dragover":
				Devent.preventDefault();
				document.title="在目标容器范围内进行拖动";
				break;
			case "dragleave":
				document.title="对象离开目标容器";
				break;
			case "drop":
				Devent.preventDefault();
				document.title="在目标容器中放下该对象";
				break;
		}
	}
</script>
</body>
</html>
