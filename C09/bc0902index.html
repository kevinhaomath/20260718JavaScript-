<script type="text/javascript">
function Refurbish(){
    var code = window.event.keyCode;
    if(code==65){
        alert("您的答案是A\n答案不正确！")
    }else if(code==66){
        alert("您的答案是B\n答案不正确！")
    }else if(code==67){
        alert("您的答案是C\n答案正确！")
    }else if(code==68){
        alert("您的答案是D\n答案不正确！")
    }
}
document.onkeydown=Refurbish;
</script>
